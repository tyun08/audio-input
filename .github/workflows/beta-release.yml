name: Beta Release

# Every push to development (including a merged feature branch) builds, signs,
# notarizes, and publishes the next patch as v<semver>-beta.<N>. The stable
# version on main is the source of truth, so 0.4.16 produces 0.4.17-beta.1.
# Beta releases never update the Homebrew tap.

on:
  push:
    branches:
      - development
  workflow_dispatch:

# Do not let simultaneous development pushes allocate the same beta number.
concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  create-prerelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.create.outputs.result }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next beta version
        id: meta
        run: |
          git fetch origin main --tags --force --quiet
          STABLE=$(git show origin/main:package.json | \
            sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)
          if [[ ! "$STABLE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not parse the stable version from main: '$STABLE'"
            exit 1
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$STABLE"
          BASE="${MAJOR}.${MINOR}.$((PATCH + 1))"
          LAST=$(git tag --list "v${BASE}-beta.*" --sort=-version:refname | head -1)
          if [ -n "$LAST" ]; then
            LAST_NUMBER="${LAST##*.}"
            if [[ ! "$LAST_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not parse beta number from tag '$LAST'"
              exit 1
            fi
            NUMBER=$((LAST_NUMBER + 1))
          else
            NUMBER=1
          fi

          VERSION="${BASE}-beta.${NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          echo "Stable ${STABLE} -> beta ${VERSION}"

      - name: Generate release notes
        id: notes
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          RANGE="${PREV:+${PREV}..HEAD}"
          RANGE="${RANGE:-HEAD}"
          {
            echo "body<<EOF"
            echo "⚠️ **Pre-release — not for production use.** Download and test, then report issues."
            echo ""
            git log $RANGE --pretty=format:"- %s" | grep -v "^- Merge " | grep -v "^- docs:" | head -30
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Prerelease
        id: create
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Audio Input ${tag}`,
              target_commitish: context.sha,
              body: `${{ steps.notes.outputs.body }}`,
              draft: true,
              prerelease: true,
            });
            return data.id;
          result-encoding: string

  build-macos:
    needs: create-prerelease
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: '--target aarch64-apple-darwin'
          - args: '--target x86_64-apple-darwin'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Patch tauri.conf.json with full pre-release version
        shell: bash
        run: |
          VERSION=${{ needs.create-prerelease.outputs.version }}
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" src-tauri/tauri.conf.json

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          rm -f "$CERT_PATH"

      - name: Build and upload to prerelease
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-prerelease.outputs.release-id }}
          args: ${{ matrix.args }}

  build-windows:
    needs: create-prerelease
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Patch tauri.conf.json with full pre-release version
        shell: bash
        run: |
          VERSION=${{ needs.create-prerelease.outputs.version }}
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" src-tauri/tauri.conf.json

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install --no-progress -y wixtoolset

      - name: Build and upload to prerelease
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-prerelease.outputs.release-id }}

  publish:
    needs: [create-prerelease, build-macos, build-windows]
    # Always publish once macOS builds succeed; Windows failure is non-blocking.
    if: ${{ always() && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download signature files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/sigs
          gh release download "v${{ needs.create-prerelease.outputs.version }}" \
            --repo tyun08/audio-input \
            --pattern "*.sig" \
            --dir /tmp/sigs || true
          ls -la /tmp/sigs

      - name: Generate latest-beta.json
        env:
          VERSION: ${{ needs.create-prerelease.outputs.version }}
        run: |
          set -e
          BASE="https://github.com/tyun08/audio-input/releases/download/v${VERSION}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          read_sig() {
            local f=$(ls /tmp/sigs/$1 2>/dev/null | head -1)
            [ -n "$f" ] && cat "$f" | tr -d '\n' || echo ""
          }

          SIG_ARM=$(read_sig "*aarch64.app.tar.gz.sig")
          SIG_INTEL=$(read_sig "*x64.app.tar.gz.sig")
          SIG_WIN=$(read_sig "*x64-setup.exe.sig")

          PLATFORMS="{}"
          if [ -n "$SIG_ARM" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg s "$SIG_ARM" --arg u "${BASE}/Audio.Input_aarch64.app.tar.gz" \
              '. + {"darwin-aarch64": {signature: $s, url: $u}}')
          fi
          if [ -n "$SIG_INTEL" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg s "$SIG_INTEL" --arg u "${BASE}/Audio.Input_x64.app.tar.gz" \
              '. + {"darwin-x86_64": {signature: $s, url: $u}}')
          fi
          if [ -n "$SIG_WIN" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg s "$SIG_WIN" --arg u "${BASE}/Audio.Input_${VERSION}_x64-setup.exe" \
              '. + {"windows-x86_64": {signature: $s, url: $u}}')
          fi

          jq -n \
            --arg v "$VERSION" \
            --arg d "$DATE" \
            --arg n "Beta release — see https://github.com/tyun08/audio-input/releases/tag/v${VERSION}" \
            --argjson p "$PLATFORMS" \
            '{version: $v, notes: $n, pub_date: $d, platforms: $p}' > latest-beta.json

          echo "=== latest-beta.json ==="
          cat latest-beta.json

      - name: Publish prerelease and advance the beta channel manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.create-prerelease.outputs.version }}" latest-beta.json \
            --repo tyun08/audio-input --clobber
          gh release edit "v${{ needs.create-prerelease.outputs.version }}" \
            --draft=false \
            --repo tyun08/audio-input

          # GitHub's /releases/latest URL intentionally excludes prereleases.
          # Keep a small permanent prerelease tagged "beta" as the fixed
          # updater endpoint; its manifest points at the newest versioned beta.
          if ! gh release view beta --repo tyun08/audio-input >/dev/null 2>&1; then
            gh release create beta \
              --repo tyun08/audio-input \
              --target "${GITHUB_SHA}" \
              --title "Audio Input Beta Channel" \
              --notes "Machine-readable update metadata for the opt-in beta channel." \
              --prerelease
          fi
          gh release upload beta latest-beta.json \
            --repo tyun08/audio-input --clobber
